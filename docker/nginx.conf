server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Keep TTLs short so core recreate/IP churn
    # does not leave nginx stuck on a stale upstream address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Management / auth / usage API
    location /api/ {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Codex / Claude compatible surface
    location /v1/ {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }


    location = /readyz {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
