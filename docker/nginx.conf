server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Keep TTLs short so core recreate/IP churn
    # does not leave nginx stuck on a stale upstream address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The public HTTPS proxy reaches this loopback-published port through the
    # fixed Compose gateway. Recover its forwarded client address before
    # passing the request to core so authentication limits stay per client.
    set_real_ip_from 172.29.250.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Management / auth / usage API
    location /api/ {
        client_max_body_size 1m;
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Codex / Claude compatible surface
    location /v1/ {
        client_max_body_size 16m;
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /livez {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream/livez;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        set $provider_core_upstream provider-core:8317;
        proxy_pass http://$provider_core_upstream/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
